<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Beads x Imran</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3eef8;
        --panel: #ffffff;
        --ink: #2b2140;
        --sub: #6e6285;
        --violet: #5e3d8c;
        --violet-dark: #472c6c;
        --rose: #dd9aa6;
        --line: #e3d9ee;
        --danger: #b5495b;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1626;
          --panel: #251d33;
          --ink: #efe9f7;
          --sub: #b3a6c7;
          --violet: #b79ce0;
          --violet-dark: #9678c9;
          --rose: #e4aeb8;
          --line: #3a2f4c;
          --danger: #e28596;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c1626;
        --panel: #251d33;
        --ink: #efe9f7;
        --sub: #b3a6c7;
        --violet: #b79ce0;
        --violet-dark: #9678c9;
        --rose: #e4aeb8;
        --line: #3a2f4c;
        --danger: #e28596;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", system-ui, sans-serif;
        line-height: 1.45;
        display: flex;
        justify-content: center;
      }
      .wrap {
        width: 100%;
        max-width: 480px;
        padding: 22px 16px 32px;
      }
      h1 {
        font-family: "Newsreader", Georgia, serif;
        font-weight: 600;
        font-style: italic;
        font-size: 24px;
        margin: 0 0 2px;
        color: var(--violet-dark);
      }
      .tag {
        color: var(--sub);
        font-size: 12.5px;
        margin: 0 0 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 11.5px;
        color: var(--sub);
        margin: 0 0 3px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > div {
        flex: 1;
        min-width: 0;
      }
      input,
      select {
        width: 100%;
        padding: 8px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font-size: 13.5px;
        font-family: inherit;
        margin-bottom: 9px;
        appearance: none;
      }
      select {
        background-image:
          linear-gradient(45deg, transparent 50%, var(--sub) 50%),
          linear-gradient(135deg, var(--sub) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) center,
          calc(100% - 13px) center;
        background-size: 5px 5px;
        background-repeat: no-repeat;
      }
      input:last-child,
      select:last-child {
        margin-bottom: 0;
      }
      .field-group {
        display: none;
      }
      .field-group.visible {
        display: block;
      }
      .add-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 9px;
        background: var(--violet-dark);
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        margin-top: 2px;
      }
      .add-btn:active {
        opacity: 0.85;
      }
      .list-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
      }
      .list-head h2 {
        font-family: "Newsreader", serif;
        font-weight: 600;
        font-size: 17px;
        margin: 0;
        color: var(--ink);
      }
      .count {
        color: var(--violet);
        font-weight: 600;
        font-size: 14px;
      }
      .item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .item:last-child {
        border-bottom: none;
      }
      .item .info {
        font-size: 14px;
        line-height: 1.5;
      }
      .item .info b {
        color: var(--violet-dark);
      }
      .item .meta {
        color: var(--sub);
        font-size: 12.5px;
      }
      .item .qty {
        color: var(--sub);
        font-size: 13.5px;
        white-space: nowrap;
      }
      .del {
        background: none;
        border: none;
        color: var(--danger);
        font-size: 13px;
        cursor: pointer;
        padding: 6px 0 0;
        font-family: inherit;
        flex-shrink: 0;
      }
      .empty {
        color: var(--sub);
        font-size: 13.5px;
        text-align: center;
        padding: 14px 0;
      }
      .submit-btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 11px;
        background: var(--violet);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .submit-btn:disabled {
        opacity: 0.5;
      }
      .copy-btn {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--panel);
        color: var(--violet-dark);
        font-size: 14.5px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        margin-top: 10px;
      }
      .copy-btn:disabled {
        opacity: 0.5;
      }
      .note {
        color: var(--sub);
        font-size: 12px;
        text-align: center;
        margin-top: 10px;
      }

      html {
        max-width: 100%;
        overflow-x: hidden;
      }
      body {
        max-width: 100%;
      }

      .wrap {
        width: 100%;
        max-width: 480px;
        min-width: 0;
        padding: 22px 16px 32px;
      }

      input,
      select {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 8px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font-size: 13.5px;
        font-family: inherit;
        margin-bottom: 9px;
        appearance: none;
      }

      .item .info {
        font-size: 14px;
        line-height: 1.5;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      /* ===== readability ===== */
      :root {
        --tint: #efe7f8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --tint: #33294a;
        }
      }
      :root[data-theme="dark"] {
        --tint: #33294a;
      }
      body {
        font-size: 16px;
      }
      .wrap {
        max-width: 520px;
      }
      h1 {
        font-size: 29px;
      }
      .tag {
        font-size: 14.5px;
      }
      .card {
        padding: 16px;
        border-radius: 14px;
      }
      .card-title {
        font-family: "Newsreader", Georgia, serif;
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 12px;
        color: var(--ink);
      }
      label {
        font-size: 13.5px;
        font-weight: 500;
        margin-bottom: 5px;
      }
      .card input {
        font-size: 16px;
        min-height: 46px;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 12px;
      }
      .add-btn {
        min-height: 50px;
        font-size: 16.5px;
        border-radius: 11px;
        margin-top: 4px;
      }
      .ghost-btn {
        width: 100%;
        min-height: 46px;
        margin-top: 8px;
        background: none;
        border: 1px solid var(--line);
        border-radius: 11px;
        color: var(--sub);
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }
      .ghost-btn[hidden] {
        display: none;
      }
      .card.editing {
        border-color: var(--violet);
        box-shadow: 0 0 0 3px var(--tint);
      }
      .submit-btn {
        min-height: 54px;
      }
      .note {
        font-size: 13px;
      }

      /* ===== searchable dropdown ===== */
      .combo {
        position: relative;
        display: block;
        margin-bottom: 12px;
      }
      .combo-btn {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 46px;
        padding: 10px 34px 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background-color: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        text-align: left;
        cursor: pointer;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--sub) 50%),
          linear-gradient(135deg, var(--sub) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) center,
          calc(100% - 13px) center;
        background-size: 5px 5px;
        background-repeat: no-repeat;
      }
      .combo.open .combo-btn {
        border-color: var(--violet);
      }
      .combo-val {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-height: 1.2em;
      }
      .combo-pop {
        position: absolute;
        top: calc(100% + 4px);
        z-index: 20;
        width: 100%;
        min-width: 220px;
        max-width: min(340px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(40, 20, 70, 0.25);
        overflow: hidden;
      }
      .combo-pop[hidden] {
        display: none;
      }
      .combo-pop .combo-search {
        width: calc(100% - 16px);
        margin: 8px;
      }
      .combo-list {
        list-style: none;
        margin: 0;
        padding: 0 0 4px;
        max-height: 240px;
        overflow-y: auto;
        position: relative;
        overscroll-behavior: contain;
      }
      .combo-list li {
        padding: 11px 14px;
        min-height: 44px;
        font-size: 16px;
        cursor: pointer;
      }
      .combo-list li.sel {
        color: var(--violet-dark);
        font-weight: 600;
      }
      .combo-list li.act {
        background: var(--tint);
      }
      .combo-list li.combo-none {
        color: var(--sub);
        cursor: default;
      }

      /* ===== order list ===== */
      .list-head h2 {
        font-size: 20px;
      }
      .count {
        font-size: 15px;
      }
      .grp {
        margin-top: 12px;
      }
      .grp-head {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 10px;
        padding: 9px 12px;
        margin: 0 -4px;
        background: var(--tint);
        border-radius: 9px;
        font-size: 13.5px;
        color: var(--violet-dark);
      }
      .grp-head span {
        font-size: 16px;
        font-weight: 600;
        color: var(--ink);
      }
      .item {
        align-items: center;
        padding: 12px 4px;
      }
      .item .info {
        font-size: 16px;
      }
      .item .side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        flex-shrink: 0;
      }
      .item .qty {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
      }
      .acts {
        display: flex;
        gap: 16px;
      }
      .act-btn {
        background: none;
        border: none;
        padding: 7px 0;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .act-btn.edit {
        color: var(--violet);
      }
      .act-btn.del {
        color: var(--danger);
      }
      .item.editing {
        background: var(--tint);
        border-radius: 8px;
      }
      @keyframes flash {
        from {
          background: var(--tint);
        }
        to {
          background: transparent;
        }
      }
      .item.flash {
        animation: flash 1.4s ease-out;
      }
      .bxi-offer {
        --bxi-deep: #4a2a6b; /* match your button purple */
        --bxi-gold: #f6c65b; /* price colour */
        --bxi-serif: "Libre Baskerville", Georgia, serif;
        font-size: clamp(
          11px,
          3.4vw,
          16px
        ); /* everything inside scales from this */
        box-sizing: border-box;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.5em 0.75em;
        width: auto;
        max-width: 100%;
        min-width: 0;
        align-self: stretch;
        justify-self: stretch;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        margin: 0 0 14px;
        padding: 0.7em 1em;
        border-radius: 1.3em;
        background: var(--bxi-deep);
        color: #fff;
        box-shadow: 0 8px 18px -12px rgba(74, 42, 107, 0.8);
      }
      .bxi-offer * {
        box-sizing: border-box;
      }
      .bxi-txt {
        min-width: 0;
      }
      .bxi-badge {
        display: inline-block;
        max-width: 100%;
        padding: 0.15em 0.7em;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
        color: #ffe3a0;
        font-size: max(11px, 0.8em);
        font-weight: 600;
        line-height: 1.3;
      }
      .bxi-title {
        margin: 0.3em 0 0;
        color: #fff;
        overflow-wrap: anywhere;
        font: italic 700 1.55em/1.15 var(--bxi-serif);
      }
      .bxi-price {
        justify-self: end;
        text-align: center;
        line-height: 1;
        padding: 0.45em 0.8em 0.55em;
        border-radius: 1em;
        background: var(--bxi-gold);
        color: var(--bxi-deep);
        box-shadow: 0 5px 12px -6px rgba(0, 0, 0, 0.5);
      }
      .bxi-price small {
        display: block;
        margin-bottom: 0.25em;
        font-size: max(11px, 0.75em);
        font-weight: 600;
      }
      .bxi-price b {
        display: block;
        font: 700 1.5em/1 var(--bxi-serif);
        white-space: nowrap;
      }

      /* very small phones: price moves under the text as a full-width bar */
      @media (max-width: 340px) {
        .bxi-offer {
          grid-template-columns: minmax(0, 1fr);
        }
        .bxi-price {
          justify-self: stretch;
          display: flex;
          align-items: baseline;
          justify-content: center;
          gap: 0.5em;
          padding: 0.4em 0.8em;
        }
        .bxi-price small,
        .bxi-price b {
          margin: 0;
        }
      }

      /* pearl beads (decoration, behind the text) */
      .bxi-bead {
        position: absolute;
        z-index: -1;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
          circle at 30% 28%,
          #fff,
          #eadcf6 50%,
          #c7add9
        );
        animation: bxi-bob 6s ease-in-out infinite;
      }
      .bxi-bead.a {
        width: 4.2em;
        height: 4.2em;
        top: -1.4em;
        right: -1em;
        opacity: 0.2;
      }
      .bxi-bead.c {
        width: 2.6em;
        height: 2.6em;
        bottom: -1.2em;
        left: -0.8em;
        opacity: 0.16;
        animation-delay: -3s;
      }

      /* soft light sweep every few seconds */
      .bxi-offer::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(
          105deg,
          transparent 38%,
          rgba(255, 255, 255, 0.2) 50%,
          transparent 62%
        );
        transform: translateX(-120%);
        animation: bxi-shine 5.5s ease-in-out 1s infinite;
      }
      @keyframes bxi-shine {
        0% {
          transform: translateX(-120%);
        }
        35%,
        100% {
          transform: translateX(120%);
        }
      }
      @keyframes bxi-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bxi-offer::after,
        .bxi-bead {
          animation: none;
        }
      }
      html,
      body {
        max-width: 100%;
        overflow-x: hidden;
      }

      .wrap {
        width: 100%;
        max-width: 480px;
        min-width: 0;
        padding: 22px 16px 32px;
      }

      input,
      select {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 8px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font-size: 13.5px;
        font-family: inherit;
        margin-bottom: 9px;
        appearance: none;
      }

      .item .info {
        font-size: 14px;
        line-height: 1.5;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .item {
        align-items: center;
        padding: 6px 4px;
        flex-wrap: nowrap;
      }
      .item .side {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .item .qty {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .acts {
        display: flex;
        gap: 10px;
      }
      .act-btn {
        background: none;
        border: none;
        padding: 2px 0;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      
        .combo-list {
        display: none;
      }
      .combo-pop {
        top: 0;
        left: 0 !important;
        right: auto !important;
        width: 100%;
        min-width: 0;
        max-width: none;
        background: none;
        border: none;
        box-shadow: none;
        border-radius: 10px;
      }
      .combo-pop .combo-search {
        display: block;
        width: 100%;
        min-height: 46px;
        margin: 0;
        padding: 10px 12px;
        font-size: 16px;
        border: 1px solid var(--violet);
        border-radius: 10px;
        outline: none;
      }
      .combo-search::placeholder {
        color: var(--ink);
        opacity: 0.55;
      }
      .combo-search::-webkit-calendar-picker-indicator {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bxi-offer" role="region" aria-label="Khaas offer">
        <div class="bxi-txt">
          <span class="bxi-badge">✦ Khaas offer</span>
          <p class="bxi-title">Nakhun Sitara</p>
        </div>
        <div class="bxi-price"><small>Sirf</small><b>Rs. 1100</b></div>
        <i class="bxi-bead a" aria-hidden="true"></i>
        <i class="bxi-bead c" aria-hidden="true"></i>
      </div>
      <h1>Beads x Imran</h1>
      <p class="tag">
        Apna order neechay banayein, hum WhatsApp par receive kar lenge
      </p>

      <div class="card">
        <label>Aapka naam</label>
        <input
          id="custName"
          type="text"
          placeholder="Naam likhein"
          autocomplete="name"
          style="margin-bottom: 0"
        />
      </div>

      <div class="card" id="formCard">
        <h3 class="card-title" id="formTitle">Item chunein</h3>
        <label>Category</label>
        <div class="combo" id="categorySel"></div>

        <div class="row">
          <div class="field-group" id="sizeGroup">
            <label id="sizeLabel">Size</label>
            <div class="combo" id="sizeSelect"></div>
            <input id="sizeInput" type="text" placeholder="Size likhein" />
          </div>
          <div class="field-group" id="colorGroup">
            <label>Color</label>
            <div class="combo" id="colorSelect"></div>
            <input id="colorInput" type="text" placeholder="Color likhein" />
          </div>
        </div>

        <div class="field-group" id="shapeGroup">
          <label>Shape</label>
          <div class="combo" id="shapeSelect"></div>
        </div>

        <div class="row">
          <div class="field-group" id="finishGroup">
            <label>Finish</label>
            <div class="combo" id="finishSelect"></div>
          </div>
          <div class="field-group visible" id="qtyGroup">
            <label>Quantity</label>
            <input
              id="qtyInput"
              type="number"
              min="0"
              step="0.01"
              value="0"
              list="qtyPresets"
            />
            <datalist id="qtyPresets">
              <option value="100"></option>
              <option value="50"></option>
              <option value="200"></option>
              <option value="300"></option>
              <option value="400"></option>
              <option value="500"></option>
              <option value="1"></option>
              <option value="2"></option>
              <option value="3"></option>
              <option value="4"></option>
              <option value="5"></option>
              <option value="6"></option>
              <option value="7"></option>
              <option value="8"></option>
              <option value="9"></option>
              <option value="10"></option>
              <option value="20"></option>
              <option value="30"></option>
              <option value="40"></option>
              <option value="1000"></option>
            </datalist>
          </div>
          <div class="field-group" id="unitGroup">
            <label>Unit</label>
            <div class="combo" id="unitSelect"></div>
          </div>
        </div>
        <button class="add-btn" id="addBtn">+ Add to order</button>
        <button class="ghost-btn" id="cancelBtn" hidden>
          Edit cancel karein
        </button>
      </div>

      <div class="card">
        <div class="list-head">
          <h2>Order list</h2>
          <span class="count" id="totalCount">0 items</span>
        </div>
        <div id="orderList">
          <p class="empty">Abhi koi item add nahi hua</p>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" disabled>
        Send order on WhatsApp
      </button>
      <button class="copy-btn" id="copyBtn" disabled>Copy order text</button>
      <p class="note" id="copyNote">
        Agar WhatsApp na khule to yeh button dabakar order text copy karein aur
        khud WhatsApp mein paste karke bhej dein
      </p>
    </div>

    <script>
      const WHATSAPP_NUMBER = "923212421990";

      const CATEGORIES = [

        },
        "BNA HUA MOGRA": {

          unit: ["Kg", "Gm"],
          color: [

          ],
        },
        QANCHA: {
          size: ["3mm", "4mm", "6mm", "8mm", "10mm"],
          color: ["Golden", "White"],
        },
        "MOGRA TAAR": { noSize: true, color: ["Silver", "Golden"] },
        "TIKKI STONE & ARTICLES": {
          sizeShape: [
            "3mm Tikki",
            "4mm Tikki",
            "6mm Tikki",
            "8mm Tikki",
            "38# Button",
            "13x18 Button",
            "5x10 Gilli",
            "6x12 Gilli",
            "8x13 Badam",
            "13x18 Badam",
            "6mm Flower",
            "8mm Flower",
            "10mm Flower",
          ],
          color: ["Lc","White", "Ab", "Sattan"],
          finish: ["", "Plain", "Ab", "Hole", "Clip wala"],
        },
      };

      const $ = (id) => document.getElementById(id);
      let order = [],
        editIndex = null,
        flashIndex = null,
        flashScroll = false,
        openCombo = null;

      const esc = (t) =>
        String(t).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      // Typed letters: pehle jin ka shuru wahi ho, phir jin ke kisi lafz ka shuru wahi ho, phir baaqi
      function rankOptions(list, q) {
        q = q.trim().toLowerCase();
        if (!q) return list;
        const starts = [],
          wordStarts = [],
          contains = [];
        list.forEach((v) => {
          const t = v.toLowerCase();
          if (!t) return;
          if (t.startsWith(q)) starts.push(v);
          else if (t.split(/[\s\/\-]+/).some((w) => w.startsWith(q)))
            wordStarts.push(v);
          else if (t.includes(q)) contains.push(v);
        });
        return [...starts, ...wordStarts, ...contains];
      }

      function initCombo(el) {
        el.innerHTML =
          '<button type="button" class="combo-btn"><span class="combo-val"></span></button>' +
          '<div class="combo-pop" hidden><input class="combo-search" type="search" placeholder="Search likhein..." autocomplete="off"><ul class="combo-list"></ul></div>';
        const btn = el.querySelector(".combo-btn"),
          valEl = el.querySelector(".combo-val"),
          pop = el.querySelector(".combo-pop"),
          search = el.querySelector(".combo-search"),
          list = el.querySelector(".combo-list");
        list.style.setProperty("display", "none", "important");
        // Keyboard suggestions (quantity jaisay) ke liye datalist
        const dl = document.createElement("datalist");
        dl.id = "dl_" + (el.id || Math.random().toString(36).slice(2));
        el.appendChild(dl);
        search.setAttribute("list", dl.id);
        let options = [],
          current = "",
          shown = [],
          active = 0;

        function setValue(v) {
          current = v;
          valEl.textContent = v;
        }

        function scrollActive() {
          const a = list.querySelector(".act");
          if (!a) return;
          if (a.offsetTop < list.scrollTop) list.scrollTop = a.offsetTop;
          else if (
            a.offsetTop + a.offsetHeight >
            list.scrollTop + list.clientHeight
          )
            list.scrollTop = a.offsetTop + a.offsetHeight - list.clientHeight;
        }
        function mark() {
          list
            .querySelectorAll("li[data-i]")
            .forEach((li, i) => li.classList.toggle("act", i === active));
          scrollActive();
        }
        function render() {
          shown = rankOptions(options, search.value);
          active = search.value.trim()
            ? 0
            : Math.max(0, shown.indexOf(current));
          list.innerHTML = "";
          if (!shown.length) {
            list.innerHTML = '<li class="combo-none">Kuch nahi mila</li>';
            return;
          }
          shown.forEach((v, i) => {
            const li = document.createElement("li");
            li.textContent = v;
            li.dataset.i = i;
            if (v === current) li.classList.add("sel");
            list.appendChild(li);
          });
          mark();
        }
        function close() {
          pop.hidden = true;
          el.classList.remove("open");
          if (openCombo === close) openCombo = null;
        }
        function open() {
          if (openCombo) openCombo();
          pop.hidden = false;
          el.classList.add("open");
          openCombo = close;
          pop.style.left = "0";
          pop.style.right = "auto";
          if (pop.getBoundingClientRect().right > window.innerWidth - 8) {
            pop.style.left = "auto";
            pop.style.right = "0";
          }
          search.value = "";
          search.placeholder = current || "Search likhein...";
          render();
          search.focus({ preventScroll: true });
          if (window.matchMedia("(max-width:600px)").matches)
            setTimeout(
              () => el.scrollIntoView({ block: "start", behavior: "smooth" }),
              200,
            );
        }
        function pick(v) {
          setValue(v);
          close();
          el.dispatchEvent(new Event("change"));
          btn.focus({ preventScroll: true });
        }

        btn.addEventListener("click", () => (pop.hidden ? open() : close()));
        search.addEventListener("input", (e) => {
          // Keyboard suggestion par tap karne se seedha select ho jaye
          if (!e.inputType || e.inputType === "insertReplacementText") {
            const hit = options.find((o) => o === search.value);
            if (hit) return pick(hit);
          }
          render();
        });
        search.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!shown.length) return;
            active =
              (active + (e.key === "ArrowDown" ? 1 : -1) + shown.length) %
              shown.length;
            mark();
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (shown.length) pick(shown[active]);
          } else if (e.key === "Escape") {
            close();
            btn.focus({ preventScroll: true });
          }
        });
        list.addEventListener("mousedown", (e) => e.preventDefault());
        list.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-i]");
          if (li) pick(shown[Number(li.dataset.i)]);
        });

        Object.defineProperty(el, "value", { get: () => current });
        el.setOptions = (vals) => {
          options = vals.map((v) => String(v).trim());
          dl.innerHTML = "";
          options.forEach((v) => {
            const o = document.createElement("option");
            o.value = v;
            dl.appendChild(o);
          });
          setValue(options.length ? options[0] : "");
        };
        el.setValue = setValue;
      }
      document.querySelectorAll(".combo").forEach(initCombo);
      document.addEventListener("pointerdown", (e) => {
        if (openCombo && !e.target.closest(".combo.open")) openCombo();
      });

      function populateSelect(sel, values) {
        sel.setOptions(values);
      }

      function renderCategorySelect() {
        const sel = $("categorySel");
        populateSelect(sel, CATEGORIES);
        sel.addEventListener("change", () => renderFields(sel.value));
      }

      function renderFields(cat) {
        const d = CATEGORY_DATA[cat] || {};

        const sizeGroup = document.getElementById("sizeGroup");
        const sizeLabel = document.getElementById("sizeLabel");
        const sizeSelect = document.getElementById("sizeSelect");
        const sizeInput = document.getElementById("sizeInput");
        const shapeGroup = document.getElementById("shapeGroup");
        const shapeSelect = document.getElementById("shapeSelect");
        const colorGroup = document.getElementById("colorGroup");
        const colorSelect = document.getElementById("colorSelect");
        const colorInput = document.getElementById("colorInput");
        const finishGroup = document.getElementById("finishGroup");
        const finishSelect = document.getElementById("finishSelect");
        const unitGroup = document.getElementById("unitGroup");
        const unitSelect = document.getElementById("unitSelect");

        const sizeOptions = d.sizeShape || d.size || null;
        if (d.noSize) {
          sizeGroup.classList.remove("visible");
        } else {
          sizeGroup.classList.add("visible");
          sizeLabel.textContent = d.sizeShapeLabel || "Size";
          if (sizeOptions) {
            populateSelect(sizeSelect, sizeOptions);
            sizeSelect.style.display = "block";
            sizeInput.style.display = "none";
          } else {
            sizeSelect.style.display = "none";
            sizeInput.style.display = "block";
            sizeInput.value = "";
          }
        }

        if (d.shape) {
          shapeGroup.classList.add("visible");
          populateSelect(shapeSelect, d.shape);
        } else {
          shapeGroup.classList.remove("visible");
        }

        colorGroup.classList.add("visible");
        if (d.color) {
          populateSelect(colorSelect, d.color);
          colorSelect.style.display = "block";
          colorInput.style.display = "none";
        } else {
          colorSelect.style.display = "none";
          colorInput.style.display = "block";
          colorInput.value = "";
        }

        if (d.finish && !d.noFinish) {
          finishGroup.classList.add("visible");
          populateSelect(finishSelect, d.finish);
        } else {
          finishGroup.classList.remove("visible");
        }

        if (d.unit) {
          unitGroup.classList.add("visible");
          populateSelect(unitSelect, d.unit);
        } else {
          unitGroup.classList.remove("visible");
        }

        document.getElementById("qtyInput").step = d.decimalQty ? "0.01" : "1";
      }

      // Order ko category -> size ke hisaab se group karta hai (WhatsApp message bhi isi tarah banta hai)
      function groupOrder() {
        const out = [];
        [...new Set(order.map((o) => o.category))].forEach((cat) => {
          const d = CATEGORY_DATA[cat] || {},
            defs = d.sizeShape || d.size || null,
            by = {};
          order.forEach((o, i) => {
            if (o.category !== cat) return;
            const k = o.size || o.shape || "";
            (by[k] = by[k] || []).push(i);
          });
          const keys = Object.keys(by);
          if (defs) keys.sort((a, b) => defs.indexOf(a) - defs.indexOf(b));
          keys.forEach((k) => out.push({ cat, size: k, idx: by[k] }));
        });
        return out;
      }

      function renderOrderList() {
        const el = $("orderList");
        const totalQty = order.reduce((s, o) => s + o.qty, 0);
        $("totalCount").textContent =
          totalQty + (totalQty === 1 ? " item" : " items");
        $("submitBtn").disabled = $("copyBtn").disabled = order.length === 0;
        if (order.length === 0) {
          el.innerHTML = '<p class="empty">Abhi koi item add nahi hua</p>';
          return;
        }

        el.innerHTML = groupOrder()
          .map(
            (g) => `
    <section class="grp">
      <div class="grp-head"><b>${esc(g.cat)}</b>${g.size ? `<span>${esc(g.size)}</span>` : ""}</div>
      ${g.idx
        .map((i) => {
          const o = order[i],
            parts = [o.color, o.finish].filter(Boolean);
          return `<div class="item${i === editIndex ? " editing" : ""}" data-i="${i}">
          <div class="info"><strong>${esc(parts.join(" · ") || "—")}</strong></div>
          <div class="side">
            <span class="qty">Qty: ${o.qty}${o.unit ? " " + esc(o.unit) : ""}</span>
            <span class="acts"><button class="act-btn edit" data-i="${i}">Edit</button><button class="act-btn del" data-i="${i}">Remove</button></span>
          </div>
        </div>`;
        })
        .join("")}
    </section>`,
          )
          .join("");

        if (flashIndex !== null) {
          const row = el.querySelector(`.item[data-i="${flashIndex}"]`);
          if (row) {
            row.classList.add("flash");
            if (flashScroll)
              row.scrollIntoView({ block: "center", behavior: "smooth" });
          }
          flashIndex = null;
          flashScroll = false;
        }
      }

      function setEditMode(i) {
        editIndex = i;
        $("addBtn").textContent =
          i === null ? "+ Add to order" : "Save changes";
        $("cancelBtn").hidden = i === null;
        $("formCard").classList.toggle("editing", i !== null);
        $("formTitle").textContent =
          i === null ? "Item chunein" : "Item edit karein";
      }

      function startEdit(i) {
        const o = order[i],
          d = CATEGORY_DATA[o.category] || {};
        $("categorySel").setValue(o.category);
        renderFields(o.category);
        if (!d.noSize) {
          if (d.sizeShape || d.size) $("sizeSelect").setValue(o.size);
          else $("sizeInput").value = o.size;
        }
        if (d.shape) $("shapeSelect").setValue(o.shape);
        if (d.color) $("colorSelect").setValue(o.color);
        else $("colorInput").value = o.color;
        if (d.finish && !d.noFinish) $("finishSelect").setValue(o.finish);
        if (d.unit) $("unitSelect").setValue(o.unit);
        $("qtyInput").value = o.qty;
        setEditMode(i);
        renderOrderList();
        $("formCard").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      renderCategorySelect();
      renderFields(CATEGORIES[0]);
      renderOrderList();

      const qtyInputEl = document.getElementById("qtyInput");
      qtyInputEl.addEventListener("focus", function () {
        if (this.value === "0") this.value = "";
      });
      qtyInputEl.addEventListener("blur", function () {
        if (this.value.trim() === "") this.value = "0";
      });

      $("addBtn").addEventListener("click", () => {
        const cat = $("categorySel").value,
          d = CATEGORY_DATA[cat] || {};
        const qty = parseFloat($("qtyInput").value);

        if (!qty || qty <= 0) {
          alert("Quantity likhein (0 se zyada honi chahiye)");
          return;
        }
        if (!d.decimalQty && !Number.isInteger(qty)) {
          alert("Is category mein sirf poori quantity (whole number) likhein");
          return;
        }

        const hasSizeList = d.sizeShape || d.size;
        const item = {
          category: cat,
          size: d.noSize
            ? ""
            : hasSizeList
              ? $("sizeSelect").value
              : $("sizeInput").value.trim(),
          shape: d.shape ? $("shapeSelect").value : "",
          color: d.color
            ? $("colorSelect").value
            : $("colorInput").value.trim(),
          finish: d.finish && !d.noFinish ? $("finishSelect").value : "",
          qty,
          unit: d.unit ? $("unitSelect").value : "",
        };

        if (editIndex === null) {
          order.push(item);
          flashIndex = order.length - 1;
        } else {
          order[editIndex] = item;
          flashIndex = editIndex;
          flashScroll = true;
          setEditMode(null);
        }
        $("qtyInput").value = "0";
        renderOrderList();
      });

      $("cancelBtn").addEventListener("click", () => {
        setEditMode(null);
        $("qtyInput").value = "0";
        renderOrderList();
      });

      $("orderList").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-i]");
        if (!b) return;
        const i = Number(b.dataset.i);
        if (b.classList.contains("edit")) {
          startEdit(i);
          return;
        }
        if (editIndex !== null) {
          setEditMode(null);
          $("qtyInput").value = "0";
        }
        order.splice(i, 1);
        renderOrderList();
      });

      function buildMessage() {
        if (order.length === 0) return null;
        const custName = $("custName").value.trim();
        if (!custName) {
          alert("Order bhejne se pehle apna naam likhein");
          $("custName").focus();
          return null;
        }

        const now = new Date(),
          today = `${String(now.getDate()).padStart(2, "0")}/${String(now.getMonth() + 1).padStart(2, "0")}/${now.getFullYear()}`;
        let msg = `*${today}*\nNaam: ${custName}\n\n`,
          lastCat = "";
        groupOrder().forEach((g) => {
          if (g.cat !== lastCat) {
            msg += (lastCat ? "\n" : "") + `*${g.cat}*\n`;
            lastCat = g.cat;
          }
          if (g.size) msg += `${g.size}\n`;
          g.idx.forEach((i) => {
            const o = order[i],
              parts = [o.color, o.finish].filter(Boolean);
            msg += `- ${parts.length ? parts.join(", ") + ", " : ""}Qty: ${o.qty}${o.unit ? " " + o.unit : ""}\n`;
          });
        });
        return msg.trim();
      }

      document.getElementById("submitBtn").addEventListener("click", () => {
        const msg = buildMessage();
        if (!msg) return;
        const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
        window.open(url, "_blank", "noopener");
      });

      document.getElementById("copyBtn").addEventListener("click", async () => {
        const msg = buildMessage();
        if (!msg) return;
        try {
          await navigator.clipboard.writeText(
            msg + `\n\nBhejein: wa.me/${WHATSAPP_NUMBER}`,
          );
          const note = document.getElementById("copyNote");
          const old = note.textContent;
          note.textContent = "Copy ho gaya — ab WhatsApp mein paste kar dein";
          setTimeout(() => {
            note.textContent = old;
          }, 2500);
        } catch (e) {
          alert("Copy nahi ho saka, order text manually likh lein");
        }
      });
      $("addBtn").addEventListener("click", () => {
        $("colorSelect").setValue("");
        $("colorInput").value = "";
        $("finishSelect").setValue("");
      });
    </script>
